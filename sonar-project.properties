# Required metadata
sonar.projectKey=devop
sonar.projectName=devop
sonar.projectVersion=1.0

# Path to source directories (required)
sonar.sources=backend/src, frontend/src

# Path to test directories
sonar.tests=backend/tests

# Removed sonar.language to let SonarQube auto-detect both JS (backend) and TS/TSX (frontend)

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**, backend/logs/**, backups/**, backend/data/**

# SonarCloud Configuration
sonar.host.url=https://sonarcloud.io
# You must create an organization on sonarcloud.io and paste the key here:
sonar.organization=YOUR_ORGANIZATION_KEY
