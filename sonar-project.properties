# Required metadata
# IMPORTANT: The projectKey must exactly match what you set in SonarCloud
# Format: your-organization-key_your-project-key
sonar.projectKey=ROS-RENDO_DevopsFinal
sonar.projectName=DevopsFinal
sonar.projectVersion=1.0

# Path to source directories (required)
sonar.sources=backend/src, frontend/src

# Path to test directories
sonar.tests=backend/tests

# Let SonarCloud auto-detect both JS (backend) and TS/TSX (frontend)

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**, backend/logs/**, backups/**, backend/data/**

# SonarCloud Configuration (replaces local SonarQube)
# The host URL is always sonarcloud.io - do not change this
sonar.host.url=https://sonarcloud.io
# Your SonarCloud organization key (found in SonarCloud > Organization > Settings)
sonar.organization=ROS-RENDO
