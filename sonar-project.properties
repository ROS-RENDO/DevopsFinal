# Required metadata
sonar.projectKey=devops-final-backend
sonar.projectName=DevOps Final Backend
sonar.projectVersion=1.0

# Path to source directories (required)
sonar.sources=backend/src

# Path to test directories
sonar.tests=backend/tests

# Language
sonar.language=js

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**, backend/logs/**, backups/**, backend/data/**
