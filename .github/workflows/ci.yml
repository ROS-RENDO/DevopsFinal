name: CI/CD Pipeline

on:
  push:
    branches: [ "backend-ts" ]
  pull_request:
    branches: [ "backend-ts" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================
  # JOB 1 — Build, lint, SCA, SAST
  # =========================================================
  build-and-scan:
    name: Build, SCA, SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          fetch-depth: 0   # SonarCloud wants full history

      - name: Setup Node.js
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: '24'

      - name: Backend - install, audit, build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          npm ci --ignore-scripts
          npx prisma generate
          npm audit --audit-level=high
          npm run build --if-present

      - name: Frontend - install, audit, build
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build --if-present

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@961680e5305a30eb575f3ddf6bb6b2e265b68f0a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=sihacny_devsecfinal
            -Dsonar.organization=sihacny
            -Dsonar.exclusions=**/node_modules/**,**/dist/**

  # =========================================================
  # JOB 2 — Spin up the stack once, run API tests + DAST against it
  # =========================================================
  integration-and-dast:
    name: API Tests (Newman) & DAST (ZAP)
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Start application stack
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE || 'test_db' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER || 'test_user' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || 'test_pass' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_jwt_secret_key_123' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'test_jwt_refresh_secret_key_456' }}
          AUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.AUTH_TOKEN_ENCRYPTION_KEY || 'test_encryption_key_must_be_long_enough' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'dummy@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'dummy' }}
        run: |
          cat <<EOF > .env
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          MYSQL_DATABASE=$MYSQL_DATABASE
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          JWT_SECRET=$JWT_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          AUTH_TOKEN_ENCRYPTION_KEY=$AUTH_TOKEN_ENCRYPTION_KEY
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_USER=$SMTP_USER
          SMTP_PASS=$SMTP_PASS
          BACKEND_PORT=3000
          MYSQL_PORT=3306
          FRONTEND_PORT=5173
          FRONTEND_URL=http://localhost:5173
          EOF
          docker compose -f docker-compose.yml up -d --build

          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/ -o /dev/null; then
              echo "Backend is up."
              break
            fi
            echo "Not ready yet (attempt $i/30)..."
            sleep 5
            if [ "$i" -eq 30 ]; then
              echo "::error::Backend did not become healthy in time."
              docker compose logs
              exit 1
            fi
          done

      - name: Install Newman
        run: npm install -g newman --ignore-scripts

      - name: Run Postman API tests
        run: |
          newman run tests/postman/collection.json \
            --environment tests/postman/environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: newman-results
          path: newman-results.xml

      - name: Fix workspace permissions for ZAP
        run: sudo chmod -R 777 .

      - name: OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: 'http://localhost:3000/'
          fail_action: false

      - name: Stop application stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # =========================================================
  # JOB 3 — Build, scan, and push images (main branch only)
  # =========================================================
  build-and-push:
    name: Build & Push Images
    needs: integration-and-dast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Set image metadata
        id: meta
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build -t $REGISTRY/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.sha_tag }} backend

      - name: Build frontend image
        run: |
          docker build -t $REGISTRY/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.sha_tag }} frontend


      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/backend-ts'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

          REPO=${{ steps.meta.outputs.repo }}
          SHA_TAG=${{ steps.meta.outputs.sha_tag }}

          docker tag $REGISTRY/$REPO/backend:$SHA_TAG $REGISTRY/$REPO/backend:latest
          docker tag $REGISTRY/$REPO/frontend:$SHA_TAG $REGISTRY/$REPO/frontend:latest

          docker push $REGISTRY/$REPO/backend:$SHA_TAG
          docker push $REGISTRY/$REPO/backend:latest
          docker push $REGISTRY/$REPO/frontend:$SHA_TAG
          docker push $REGISTRY/$REPO/frontend:latest

      # No automated deploy job here — for the tunnel workflow, deployment is a
      # manual/local step: pull the image on your machine, `docker compose up`,
      # then expose it with ngrok / cloudflared. See scripts/start-demo.sh.
