name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rendo
  pull_request:
    branches:
      - main
      - rendo

env:
  DOCKER_IMAGE: "rosrendo/devops-final-backend"
  SONAR_PROJECT_KEY: "devop"

jobs:
  build-test-scan-push:
    name: Build, Test, Security Scan & Push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarQube to analyze branches accurately

      - name: SAST - SonarQube Analysis
        run: |
          echo "Running SonarQube Scanner..."
          # Running the SonarScanner CLI via Docker. It relies on GitHub Secrets for Auth and Host URL.
          docker run --rm -v $(pwd):/usr/src \
            -e SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }} \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.sources=./backend/src

      - name: Build Docker Image
        run: |
          echo "Building Docker Image..."
          cd backend
          docker build -t $DOCKER_IMAGE:${{ github.run_number }} -t $DOCKER_IMAGE:latest .

      - name: Start Temporary Container for Newman Tests
        run: |
          echo "Starting Temporary Container for Newman Tests..."
          docker run -d --name temp-backend -p 5000:5000 $DOCKER_IMAGE:latest
          # Wait 5 seconds for the Node.js server to fully start
          sleep 5

      - name: Automated Tests - Postman/Newman
        run: |
          echo "Running Postman tests via Newman Docker container..."
          # --network host allows the container to talk to localhost:5000 on the GitHub Actions runner
          docker run --rm --network host -v $(pwd)/tests:/etc/newman postman/newman run /etc/newman/postman_collection.json -k

      - name: Clean up Temporary Container
        if: always() # Always run cleanup even if Newman tests fail
        run: |
          echo "Cleaning up Temporary Container..."
          docker rm -f temp-backend || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push to Docker Hub
        run: |
          echo "Pushing to Docker Hub Registry..."
          docker push $DOCKER_IMAGE:${{ github.run_number }}
          docker push $DOCKER_IMAGE:latest
          
      - name: DAST - OWASP ZAP (Practice)
        run: |
          echo "Running Dynamic Application Security Testing against staging..."
          # docker run -t zaproxy/zap-stable zap-baseline.py -t https://staging-url.com
          echo "OWASP ZAP scan completed."

      - name: Deploy to Kubernetes (GitOps Trigger)
        run: |
          echo "Deployment is handled by ArgoCD syncing the Kubernetes manifests."
          echo "Updating K8s manifests with new image tag..."
          
          # Update the image tag in the deployment files
          sed -i "s|image: $DOCKER_IMAGE:.*|image: $DOCKER_IMAGE:${{ github.run_number }}|g" k8s/deployment-blue.yaml
          sed -i "s|image: $DOCKER_IMAGE:.*|image: $DOCKER_IMAGE:${{ github.run_number }}|g" k8s/deployment-green.yaml
          
          # Commit the changes back to the repository to trigger ArgoCD
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add k8s/deployment-blue.yaml k8s/deployment-green.yaml
          git commit -m "chore(cd): update k8s manifests to image tag ${{ github.run_number }}" || echo "No changes to commit"
          git push
