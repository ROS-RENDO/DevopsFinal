name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  sast-sca-build:
    name: Build, SCA, SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ==== SCA (npm audit) & Build Backend ====
      - name: Install Backend Dependencies & SCA
        run: |
          if [ -d "backend" ]; then
            cd backend
            npm install
            # Run SCA (Software Composition Analysis)
            npm audit --audit-level=high || echo "SCA: High vulnerabilities found in backend"
            npm run build --if-present
          else
            echo "Backend directory not found, skipping."
          fi

      # ==== SCA (npm audit) & Build Frontend ====
      - name: Install Frontend Dependencies & SCA
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install
            # Run SCA (Software Composition Analysis)
            npm audit --audit-level=high || echo "SCA: High vulnerabilities found in frontend"
            npm run build --if-present
          else
            echo "Frontend directory not found, skipping."
          fi

      # ==== SAST (SonarCloud) ====
      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=DevSec_Final
            -Dsonar.organization=camtech
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**

  dast-and-deploy:
    name: DAST & Docker Build/Push
    needs: sast-sca-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==== Infrastructure as Code (IaC) Spin-up for DAST ====
      - name: Start Application via Docker Compose (IaC)
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker compose up -d
            echo "Waiting for services to become healthy..."
            sleep 20
          else
            echo "docker-compose.yml not found, skipping."
          fi

      # ==== DAST (OWASP ZAP) ====
      - name: OWASP ZAP Baseline Scan (DAST)
        if: hashFiles('docker-compose.yml') != ''
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost/'
          fail_action: false

      - name: Stop Docker Compose
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down

      # ==== Containerize & Push (GHCR) ====
      - name: Build & Push Docker Images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # Automatically provided by GitHub - no secrets needed!
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticate to GitHub Container Registry using the built-in token
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Convert repository name to lowercase (Docker requirement)
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          if [ -d "backend" ]; then
            docker build -t ghcr.io/$REPO_NAME/backend:latest ./backend
            docker push ghcr.io/$REPO_NAME/backend:latest
          fi
          
          if [ -d "frontend" ]; then
            docker build -t ghcr.io/$REPO_NAME/frontend:latest ./frontend
            docker push ghcr.io/$REPO_NAME/frontend:latest
          fi
