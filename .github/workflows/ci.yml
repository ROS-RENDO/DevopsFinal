name: CI/CD Pipeline

on:
  push:
    branches: [ "backend-ts" ]
  pull_request:
    branches: [ "backend-ts" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================
  # JOB 1 — Build, lint, SCA, SAST
  # =========================================================
  build-and-scan:
    name: Build, SCA, SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud wants full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Backend - install, audit, build
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high
          npm run build --if-present

      # - name: Frontend - install, audit, build
      #   run: |
      #     cd frontend
      #     npm ci
      #     npm audit --audit-level=high
      #     npm run build --if-present

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=sihacny_devsecfinal
            -Dsonar.organization=sihacny
            -Dsonar.exclusions=**/node_modules/**,**/dist/**

