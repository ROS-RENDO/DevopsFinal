services:
  # frontend:
  #   image: ghcr.io/${GHCR_REPO}/frontend:latest
  #   expose:
  #     - "80"
  #   # add depends_on and other configs as needed when frontend is ready

  db:
    image: mysql:8.0
    env_file: ./backend/.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-blue:
    image: ghcr.io/${GHCR_REPO}/backend:latest
    expose:
      - "3000"
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm start"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  backend-green:
    image: ghcr.io/${GHCR_REPO}/backend:latest
    expose:
      - "3000"
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm start"
    profiles: ["green"]
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-blue

volumes:
  db_data:
