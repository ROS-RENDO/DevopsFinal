services:
  backend:
    build:
      context: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - PORT=5000
    volumes:
      - backend-data:/app/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../nginx/certs:/etc/nginx/certs:ro

volumes:
  backend-data: