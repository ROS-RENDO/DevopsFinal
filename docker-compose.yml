version: '3.8'

services:
  backend-1:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: devops-final-backend:latest
    container_name: backend_replica_1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - ./backend/server.key:/app/server.key:ro
      - ./backend/server.cert:/app/server.cert:ro

  backend-2:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: devops-final-backend:latest
    container_name: backend_replica_2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - ./backend/server.key:/app/server.key:ro
      - ./backend/server.cert:/app/server.cert:ro

  nginx:
    image: nginx:alpine
    container_name: nginx_loadbalancer
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/server.key:/etc/nginx/ssl/server.key:ro
      - ./backend/server.cert:/etc/nginx/ssl/server.cert:ro
    depends_on:
      - backend-1
      - backend-2

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma_monitor
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma-data:/app/data
